<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingSystem Dashboard</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=0.42.2">
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">TradingSystem</div>
        <div class="account-info">
            <div class="account-item">
                <span class="account-label">Balance</span>
                <span id="account-balance" class="account-value loading">--</span>
            </div>
            <div class="account-item">
                <span class="account-label">Unrealized P&L</span>
                <span id="account-pnl" class="account-value loading">--</span>
            </div>
            <div class="account-item">
                <span class="account-label">Daily P&L</span>
                <span id="daily-pnl" class="account-value loading">--</span>
            </div>
            <div class="account-item">
                <span class="account-label">Margin Used</span>
                <span id="margin-used" class="account-value loading">--</span>
            </div>
        </div>
        <div class="connection-status" id="connection-status" title="Connecting...">
            <span class="plug-icon">⏻</span>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Instrument Tabs -->
        <div class="instrument-tabs">
            <div class="tab active" data-instrument="EUR_USD">EUR/USD</div>
            <div class="tab" data-instrument="GBP_USD">GBP/USD</div>
            <div class="tab" data-instrument="USD_JPY">USD/JPY</div>
            <div class="tab" data-instrument="AUD_USD">AUD/USD</div>
            <div class="tab" data-instrument="USD_CAD">USD/CAD</div>
        </div>

        <!-- Chart Area -->
        <div class="chart-area">
            <div class="chart-container">
                <div class="chart-header">
                    <div class="chart-info">
                        <span id="chart-title" class="chart-title">EUR/USD</span>
                        <span id="chart-price" class="chart-price">--</span>
                        <span class="ohlc-values">
                            <span class="ohlc-item">O: <span id="chart-open">--</span></span>
                            <span class="ohlc-item">H: <span id="chart-high">--</span></span>
                            <span class="ohlc-item">L: <span id="chart-low">--</span></span>
                            <span class="ohlc-item">C: <span id="chart-close">--</span></span>
                        </span>
                        <span id="chart-change" class="chart-change">--</span>
                    </div>
                    <div class="timeframe-buttons">
                        <button class="tf-btn" data-period="M1">1m</button>
                        <button class="tf-btn active" data-period="M5">5m</button>
                        <button class="tf-btn" data-period="M15">15m</button>
                        <button class="tf-btn" data-period="H1">1H</button>
                        <button class="tf-btn" data-period="H4">4H</button>
                        <button class="tf-btn" data-period="D">1D</button>
                    </div>
                </div>
                <div id="chart"></div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <!-- Sidebar Toggle -->
            <div class="panel sidebar-header">
                <div class="panel-header">
                    <span>Trading</span>
                    <button class="sidebar-toggle-btn" id="sidebar-toggle" title="Toggle sidebar">›</button>
                </div>
            </div>
            <!-- Indicators -->
            <div class="panel sidebar-content collapsible">
                <div class="panel-header" data-toggle="panel">
                    <span>Indicators</span>
                    <div class="panel-header-right">
                        <span id="indicator-count" style="font-size: 11px;">0/10</span>
                        <span class="panel-toggle">▼</span>
                    </div>
                </div>
                <div class="panel-content">
                    <div class="indicator-selector">
                        <label class="sidebar-label">Add Indicator</label>
                        <select id="indicator-select" class="form-input" style="width: 100%;">
                            <option value="">Select indicator...</option>
                        </select>
                    </div>
                    <div id="active-indicators" class="active-indicators">
                        <div class="empty-state">No indicators added</div>
                    </div>
                </div>
            </div>
            <!-- Strategy Instances -->
            <div class="panel sidebar-content collapsible">
                <div class="panel-header" data-toggle="panel">
                    <span>Strategies</span>
                    <div class="panel-header-right">
                        <span id="strategy-instance-count" style="font-size: 11px;">0</span>
                        <span class="panel-toggle">▼</span>
                    </div>
                </div>
                <div class="panel-content">
                    <div class="strategy-instance-actions">
                        <label class="sidebar-label">Saved Configurations</label>
                        <button id="new-strategy-btn" class="btn-small" onclick="app.showStrategyInstanceModal()">+ New</button>
                    </div>
                    <div id="strategy-instances-container">
                        <div class="empty-state">No saved strategies</div>
                    </div>
                </div>
            </div>

            <!-- Order Form -->
            <div class="panel sidebar-content collapsible">
                <div class="panel-header" data-toggle="panel">
                    <span>New Order</span>
                    <span class="panel-toggle">▼</span>
                </div>
                <div class="panel-content">
                    <form id="order-form" class="order-form">
                        <div class="order-type-toggle">
                            <button type="button" class="order-type-btn buy active" data-side="BUY">Buy</button>
                            <button type="button" class="order-type-btn sell" data-side="SELL">Sell</button>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Quantity (units)</label>
                            <input type="number" id="order-quantity" class="form-input" value="1000" step="100" min="1">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Stop Loss</label>
                                <input type="text" id="order-stop-loss" class="form-input" placeholder="Optional">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Take Profit</label>
                                <input type="text" id="order-take-profit" class="form-input" placeholder="Optional">
                            </div>
                        </div>
                        <button type="submit" id="submit-order-btn" class="submit-btn">Place BUY Order</button>
                    </form>
                </div>
            </div>

            <!-- Recent Signals -->
            <div class="panel signals-panel sidebar-content collapsible">
                <div class="panel-header" data-toggle="panel">
                    <span>Signals</span>
                    <div class="panel-header-right">
                        <span style="font-size: 11px; color: var(--accent-green);">Live</span>
                        <span class="panel-toggle">▼</span>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="signals-container">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>

            <!-- Open Positions -->
            <div class="panel positions-panel sidebar-content collapsible">
                <div class="panel-header" data-toggle="panel">
                    <span>Positions</span>
                    <div class="panel-header-right">
                        <span id="positions-count" style="font-size: 11px;">--</span>
                        <span class="panel-toggle">▼</span>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="positions-container">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Strategy Instance Modal -->
    <div id="strategy-modal" class="modal hidden">
        <div class="modal-backdrop" onclick="app.hideStrategyInstanceModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="strategy-modal-title">New Strategy Instance</h3>
                <button class="modal-close" onclick="app.hideStrategyInstanceModal()">×</button>
            </div>
            <form id="strategy-instance-form" onsubmit="app.handleStrategyInstanceSubmit(event)">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="si-name" class="form-input" placeholder="e.g., GBP Daily Trend" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Strategy</label>
                    <select id="si-strategy" class="form-input" required>
                        <option value="">Select strategy...</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Instrument</label>
                        <select id="si-instrument" class="form-input" required>
                            <option value="EUR_USD">EUR/USD</option>
                            <option value="GBP_USD">GBP/USD</option>
                            <option value="USD_JPY">USD/JPY</option>
                            <option value="AUD_USD">AUD/USD</option>
                            <option value="USD_CAD">USD/CAD</option>
                            <option value="USD_CHF">USD/CHF</option>
                            <option value="NZD_USD">NZD/USD</option>
                            <option value="EUR_GBP">EUR/GBP</option>
                            <option value="EUR_JPY">EUR/JPY</option>
                            <option value="GBP_JPY">GBP/JPY</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Period</label>
                        <select id="si-period" class="form-input" required>
                            <option value="M1">1 Min</option>
                            <option value="M5">5 Min</option>
                            <option value="M15">15 Min</option>
                            <option value="H1">1 Hour</option>
                            <option value="H4">4 Hour</option>
                            <option value="D">Daily</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Parameters (JSON)</label>
                    <textarea id="si-params" class="form-input" rows="3" placeholder='{"fast_period": 10, "slow_period": 20}'></textarea>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="si-enabled" checked>
                        <span>Enabled for signal generation</span>
                    </label>
                </div>
                <input type="hidden" id="si-id">
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="app.hideStrategyInstanceModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="si-submit-btn">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/api.js?v=0.44.0"></script>
    <script src="/static/js/chart.js?v=0.44.0"></script>
    <script src="/static/js/app.js?v=0.44.0"></script>
</body>
</html>
